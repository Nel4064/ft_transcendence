name: PR Auto-Checks

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
  
jobs:
  commit-lint:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      # Squash-merge approach: the PR title becomes the commit on main —
      # so we only validate that one string, not every commit.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | npx commitlint; then
            echo "::error::PR title must follow Conventional Commits: type(scope): description (e.g. fix(friends): send notification after transaction)"
            exit 1
          fi

  source-branch-check:
    name: PR Source Branch (dev only into main)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check source branch
        # Branch names are passed via env, never ${{ }} inside `run:`,
        # so a crafted branch name cannot inject shell code.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs into main must come from dev (got: $HEAD_REF). Change the base branch to dev."
            exit 1
          fi
          echo "OK: $HEAD_REF -> $BASE_REF"

