# use NGINX default configuration
events {}

http {
    server {
        listen 80;
        # default server name
        server_name _;
        client_max_body_size 2M;
        
        # frontend request
        location / {
            # ➡️ Change 'frontend' to your actual container name, e.g., development-frontend
            # Also, if you want Vite to run on port 1024 (to avoid rebuilding the image), you can specify port 1024 here
            proxy_pass http://frontend:5173; 
            
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # backend request
        location /api/ {
            proxy_pass http://backend:3000;          
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;                        
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;    
            proxy_set_header X-Forwarded-Proto $scheme;                     
        }
    }
}