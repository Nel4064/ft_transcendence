# Development overlay, merged on top of compose.yaml by `make up`.
# Adds: dev build stage, live source mounts (hot reload), published ports, readable container names.

services:
  db:
    container_name: development-db
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - app-net

  backend:
    container_name: development-backend
    build:
      target: dev
    ports:
      - "3000:3000"
    environment:
      CORS_ORIGIN: http://localhost:1024,http://${DOMAIN}:1024
    volumes:
      - ./backend:/app:Z
      - backend_node_modules:/app/node_modules
    networks:
      - app-net

  frontend:
    container_name: development-frontend
    build:
      target: dev
    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules
    networks:
      - app-net

  proxy:
    container_name: development-proxy
    build:
      target: dev
    ports:
      - "1024:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  frontend_node_modules:
  backend_node_modules: