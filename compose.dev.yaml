# Development overlay, merged on top of compose.yaml by `make up`.
# Adds: dev build stage, live source mounts (hot reload), published ports, readable container names.

services:
  db:
    container_name: development-db

  backend:
    container_name: development-backend
    build:
      target: dev
    ports:
      - "5555:3000"                             # direct API access for debugging (bypasses the proxy)
    environment:
      CORS_ORIGIN: http://localhost:1024,http://${DOMAIN}:1024
    volumes:
      - ./backend:/app:Z                        # live source; Z = SELinux relabel
      - backend_node_modules:/app/node_modules  # keeps the image's node_modules hidden from the bind mount

  frontend:
    container_name: development-frontend
    build:
      target: dev
    # environment:
    #   VITE_OAUTH_42_START_URL: ${VITE_OAUTH_42_START_URL}
    volumes:
      - ./frontend:/app:Z                       # live source; Z = SELinux relabel
      - frontend_node_modules:/app/node_modules # keeps the image's node_modules hidden from the bind mount

  proxy:
    container_name: development-proxy
    build:
      target: dev
    ports:
      - "1024:80"                               # app entry point; rootless podman cannot bind ports < 1024

volumes:
  frontend_node_modules:
  backend_node_modules:
